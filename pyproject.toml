[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harness"
version = "0.1.0"
description = "Budget-aware openJiuwen contest harness"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
harness = ["py.typed"]
